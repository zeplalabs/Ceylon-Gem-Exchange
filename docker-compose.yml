name: ceylon-gems

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ceylon_gems}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ceylon_gems_dev}
      POSTGRES_DB: ${POSTGRES_DB:-ceylon_gems}
    ports:
      # 55432 on the host by default — avoids colliding with a native Postgres install
      - '${POSTGRES_PORT:-55432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ceylon_gems}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  typesense:
    image: typesense/typesense:27.1
    restart: unless-stopped
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-ceylon_gems_dev_key}
      TYPESENSE_DATA_DIR: /data
    ports:
      - '${TYPESENSE_PORT:-8108}:8108'
    volumes:
      - typesense-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "exec 3<>/dev/tcp/localhost/8108" || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ceylon_gems}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ceylon_gems_dev}
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:9000/minio/health/live || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ceylon_gems}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ceylon_gems_dev}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb -p local/uploads &&
      mc mb -p local/media &&
      mc anonymous set download local/media &&
      echo 'buckets ready'
      "
    restart: 'no'

volumes:
  postgres-data:
  redis-data:
  typesense-data:
  minio-data:
